name: "✨ Feature Request"
description: "Suggest an idea, new file taxonomy, or improvement for tidy"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to make `tidy` better!
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What feature or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Design
      description: Describe how you envision this working, including CLI arguments or configuration examples if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
