name: "🐛 Bug Report"
description: "Create a report to help us fix a bug or unexpected behavior"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: tidy Version
      description: What version of tidy are you using? Run `tidy --version`.
      placeholder: "tidy 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Linux (Ubuntu / Debian)"
        - "Linux (Arch / Fedora / RHEL / Other)"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Run `tidy run --path ~/Downloads`
        2. Create file `foo.tar.gz`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output or Logs
      description: Please copy and paste any terminal output or relevant log entries.
      render: shell
