[package]
name = "tidy"
version = "0.2.0"
edition = "2021"
description = "A blazing-fast, zero-dependency, local-first file organizer and watcher for Linux and macOS."
authors = ["tidy contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/humayan-x/tidy"
homepage = "https://github.com/humayan-x/tidy"
readme = "README.md"

[lib]
name = "tidy"
path = "src/lib.rs"

[[bin]]
name = "tidy"
path = "src/main.rs"

[dependencies]
# CLI & Terminal UX
clap = { version = "4.5", features = ["derive", "cargo"] }
console = "0.15"
indicatif = "0.17"

# Filesystem & Watching
walkdir = "2.5"
directories = "5.0"
globset = "0.4"
notify = "6.1"
notify-debouncer-mini = "0.4"

# Detection & MIME Sniffing
infer = "0.16"

# State & Persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error Handling & Utilities
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
